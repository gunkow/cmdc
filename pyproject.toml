[project]
name = "cmdc"
version = "0.1.0"
description = "Triple Cmd+C anywhere on macOS -> AI fixes your text in place"
requires-python = ">=3.11"
dependencies = [
    "rumps>=0.4.0",
    "pynput>=1.7.6",
    "requests>=2.31",
]

[project.scripts]
cmdc = "cmdc.app:main"
cmdc-fix = "cmdc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cmdc"]
